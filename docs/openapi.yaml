            schema:
              $ref: "#/components/schemas/BookUpdateDto"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookUpdateDto"
    delete:
      tags:
      - book-controller
      summary: "Удаление книги с номером {id}"
      operationId: deletePublisher_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/authors/{id}:
    put:
      tags:
      - author-controller
      summary: "Изменение автора с номером {id}"
      operationId: updateAuthor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorUpdateDto"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
