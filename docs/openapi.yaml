openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080/test-task-cd
  description: Generated server url
paths:
  /api/publishers/{id}:
    put:
      tags:
      - publisher-controller
      summary: "Изменение издателя с номером {id}"
      operationId: updatePublisher
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherUpdateDto"
        required: true
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublisherUpdateDto"
    delete:
      tags:
      - publisher-controller
      summary: "Удаление издателя с номером {id}"
      operationId: deletePublisher
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/books/{id}:
    put:
      tags:
      - book-controller
      summary: "Изменение существующей книги с номером {id}"
      operationId: updateBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
