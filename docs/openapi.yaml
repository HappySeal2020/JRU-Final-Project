                $ref: "#/components/schemas/AuthorUpdateDto"
    delete:
      tags:
      - author-controller
      summary: "Удаление автора с номером {id}"
      operationId: deleteAuthor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/publishers:
    get:
      tags:
      - publisher-controller
      summary: "Чтение всех издателей. Фильтр по издателю, его сайту; пагинация."
      operationId: getAllPublishers
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: site
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublisherResponseDto"
    post:
      tags:
      - publisher-controller
      summary: Создание нового издателя.
      operationId: createPublisher
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherCreateDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublisherResponseDto"
  /api/books:
    get:
      tags:
