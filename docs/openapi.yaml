      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 5
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: author
        in: query
        required: false
        schema:
          type: string
      - name: printYearFrom
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: printYearTo
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: publisher
        in: query
        required: false
        schema:
          type: string
      - name: bbk
        in: query
        required: false
        schema:
          type: string
      - name: isbn
        in: query
        required: false
        schema:
          type: string
      - name: pagesFrom
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: pagesTo
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponseDto"
    post:
      tags:
      - book-controller
      summary: Создание новой книги.
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreateDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookResponseDto"
  /api/authors:
    get:
      tags:
      - author-controller
      summary: "Чтение всех авторов. Фильтр по автору, пагинация"
      operationId: getAuthors
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 5
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorResponseDto"
    post:
      tags:
      - author-controller
      summary: Создание нового автора
      operationId: createAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorCreateDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorResponseDto"
